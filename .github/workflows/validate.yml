name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate SkillShop
        run: python3 scripts/validate.py
      - name: Smoke-test public catalog search
        run: python3 scripts/search.py "multi tenant payment load test" --top 5
      - name: Smoke-test low-context router
        run: python3 plugins/skillshop/scripts/recommend.py --query "production multi tenant payment load test" --project . --top 8 --json
      - name: Assert router finds critical specialists
        run: |
          python3 plugins/skillshop/scripts/recommend.py --query "production multi tenant payment load test" --top 12 --names-only > /tmp/ranked.txt
          grep -qx 'load-test' /tmp/ranked.txt
          grep -qx 'payment-integrity' /tmp/ranked.txt
          grep -qx 'multi-tenant-review' /tmp/ranked.txt
          grep -qx 'production-readiness' /tmp/ranked.txt
      - name: Assert prompt hook routes engineering work
        run: |
          printf '%s\n' '{"hook_event_name":"UserPromptSubmit","cwd":"'"$PWD"'","prompt":"Review this project for production readiness"}' | python3 plugins/skillshop/scripts/route_prompt.py > /tmp/hook.json
          grep -q 'skillshop:shop' /tmp/hook.json
          printf '%s\n' '{"hook_event_name":"UserPromptSubmit","cwd":"'"$PWD"'","prompt":"thanks"}' | python3 plugins/skillshop/scripts/route_prompt.py > /tmp/chitchat.txt
          test ! -s /tmp/chitchat.txt
