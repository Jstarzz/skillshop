name: Bootstrap SkillShop

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/13.b64'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify SkillShop archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/*.b64 | base64 -d > /tmp/skillshop.tgz
          echo "5f30a205ffc3977ef4e23163f2f51c5a301df5a628bc47c8ec9dd434c9527dc1  /tmp/skillshop.tgz" | sha256sum -c -

      - name: Expand SkillShop
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/skillshop.tgz

      - name: Validate catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate.py

      - name: Publish repository tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: launch SkillShop with 157 engineering skills"
          git push
