name: Bootstrap SkillShop

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand repository payload
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/skillshop.tar.xz
          echo "c389013b25194aa537dd9edb6385c57da4c9a5164518baccad7b7eaa2a9cc252  /tmp/skillshop.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xJf /tmp/skillshop.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml .github/workflows/validate.yml

      - name: Validate expanded repository
        run: python3 scripts/validate.py

      - name: Commit repository
        run: |
          git config user.name "skillshop-bootstrap[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: launch SkillShop with 157 engineering skills"
          git push origin HEAD:main
