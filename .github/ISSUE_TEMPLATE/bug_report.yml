name: Skill bug
about: Report incorrect, unsafe, contradictory, or broken skill behavior
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: e.g. load-test
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task / context
      description: What task caused the bad behavior?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Better behavior
    validations:
      required: true
